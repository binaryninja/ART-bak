# ARTEX Tencent TSec Benchmark image: local one-command build and run.
# Independent of production docker-compose.yml (artex + postgres services).
# Usage:
#   cp bench/.env.example bench/.env   # Fill in LLM_API_KEY / BENCHMARK_TOKEN, etc.
#   docker compose -f docker-compose.bench.yml up --build      # Build and run in foreground (logs)
#   docker compose -f docker-compose.bench.yml up --build -d   # Background
#   docker compose -f docker-compose.bench.yml logs -f
#   docker compose -f docker-compose.bench.yml down            # Stop (add -v to delete volumes too)
# Browser: http://localhost:8787 (log in with ADMIN_PASSWORD)

services:
  artex-bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: artex-bench:latest
    container_name: artex-bench
    env_file:
      - bench/.env
    # Share host networking: direct access to target networks on the host/VPN.
    # Host mode needs no port mapping: binds host ports 8787 (UI/API), 8788 (proxy)
    # and internal PostgreSQL 5432. Free these three ports before local testing.
    network_mode: host
    restart: "no"

volumes:
  artex_bench_data:
